# Rebuilds the LIVE trip apps (itinerary, extras, weather, expenses) whenever Grok, or anyone, changes grok/data/.
# Since Mon 26 Oct 2026 grok/data/ is the source for the live apps. See grok/GROK.md.
name: Live apps rebuild from grok/data
on:
  push:
    branches: [main]
    paths: ['grok/data/**', 'source/**', '.github/workflows/grok-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grok-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium-headless-shell || python -m playwright install --with-deps chromium
      - name: Build the Grok apps
        id: build
        continue-on-error: true
        run: python3 source/grok/grok_build.py
      - name: Commit the rebuilt apps
        run: |
          git config user.name "grok-copy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="grok index.html sw.js manifest.webmanifest extras/index.html extras/sw.js extras/manifest.webmanifest weather/index.html weather/sw.js weather/manifest.webmanifest expenses/index.html expenses/sw.js expenses/manifest.webmanifest"
          for i in 1 2 3 4 5 6; do
            git add -A $FILES
              if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
            if [ "${{ steps.build.outcome }}" = "success" ]; then MSG="Live apps rebuilt from grok/data"; else MSG="Live apps NOT rebuilt: see grok/build-error.txt"; fi
            git commit -q -m "$MSG"
            if git push -q origin HEAD:main; then exit 0; fi
            # Someone pushed meanwhile (usually Grok saving a second file, or an earlier rebuild).
            # Take the latest main and rebuild from it instead of rebasing generated files.
            echo "Push clashed, rebuilding from latest main (attempt $i)"
            sleep $((i*3))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 source/grok/grok_build.py || true
          done
          exit 1
      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: |
          cat grok/build-error.txt || true
          exit 1
